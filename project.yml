name: MealColl
options:
  bundleIdPrefix: com.mealcoll
  deploymentTarget:
    iOS: "17.0"
targets:
  MealColl:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: MealColl
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.mealcoll.app
      DEVELOPMENT_TEAM: Y8WYFZ4RTF
      CODE_SIGN_STYLE: Automatic
      INFOPLIST_KEY_CFBundleDisplayName: Cooky
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
      INFOPLIST_KEY_NSCameraUsageDescription: "需要使用您的相机拍摄食材与烹饪制作过程"
      INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "需要访问相册以导入烹饪视频与食材照片"
      INFOPLIST_KEY_NSMicrophoneUsageDescription: "录制烹饪视频时需要使用麦克风"
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      SWIFT_VERSION: "5.0"
      GENERATE_INFOPLIST_FILE: YES
      CURRENT_PROJECT_VERSION: 1
      MARKETING_VERSION: 1.0.0

